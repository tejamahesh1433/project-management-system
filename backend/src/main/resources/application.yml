spring:
  application:
    name: project-management-saas
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/project_management_saas}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

security:
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:20}
  brute-force:
    max-attempts: ${BRUTE_FORCE_MAX_ATTEMPTS:5}
    lockout-minutes: ${BRUTE_FORCE_LOCKOUT_MINUTES:15}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-change-me}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
    issuer: ${JWT_ISSUER:project-management-saas}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

backup:
  directory: ${BACKUP_DIRECTORY:./backups}
  pg-dump-command: ${PG_DUMP_COMMAND:}
  pg-restore-command: ${PG_RESTORE_COMMAND:}
  schedule-cron: ${BACKUP_SCHEDULE_CRON:0 0 2 * * *}
  system-user-email: ${BACKUP_SYSTEM_USER_EMAIL:}

ai:
  ollama:
    enabled: ${OLLAMA_ENABLED:false}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding-model: nomic-embed-text
    supported-models: qwen3,gemma3,phi4-mini
